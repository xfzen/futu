syntax = "proto2";
package Qot_GetInstitutionDistribution;
option java_package = "com.futu.openapi.pb";
option go_package = "github.com/hyperjiang/futu/pb/qotgetinstitutiondistribution";

message C2S {
	required int32 market = 1;
	required int32 institutionId = 2;
}

message IndustryDistributionItem {
	optional uint64 industryId = 1;
	optional string industryName = 2;
	optional double positionValue = 3;
	optional double portfolioPct = 4;
}

message S2C {
	repeated IndustryDistributionItem dataList = 1;
}

message Request {
	required C2S c2s = 1;
}

message Response {
	required int32 retType = 1 [default = -400];
	optional string retMsg = 2;
	optional int32 errCode = 3;
	optional S2C s2c = 4;
}
