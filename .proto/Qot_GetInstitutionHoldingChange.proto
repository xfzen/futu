syntax = "proto2";
package Qot_GetInstitutionHoldingChange;
option java_package = "com.futu.openapi.pb";
option go_package = "github.com/hyperjiang/futu/pb/qotgetinstitutionholdingchange";

import "Qot_Common.proto";

enum HoldingChangeType {
	HoldingChangeType_Unknown = 0;
	HoldingChangeType_New = 1;
	HoldingChangeType_SoldOut = 2;
	HoldingChangeType_Increase = 3;
	HoldingChangeType_Decrease = 4;
}

enum SortField {
	SortField_Unknown = 0;
	SortField_ChangePct = 1;
	SortField_ChangeShares = 2;
	SortField_HoldingDate = 3;
}

enum SortDir {
	SortDir_Descending = 0;
	SortDir_Ascending = 1;
}

message C2S {
	required int32 market = 1;
	required int32 institutionId = 2;
	optional int32 changeType = 3;
	optional int32 sortField = 4;
	optional int32 sortDir = 5;
	optional int32 count = 6;
	optional string page = 7;
}

message HoldingChangeItem {
	required Qot_Common.Security security = 1;
	optional string name = 2;
	optional double portfolioPct = 3;
	optional int64 changeShares = 4;
	optional double changePct = 5;
	optional string holdingDate = 6;
	optional string source = 7;
}

message S2C {
	repeated HoldingChangeItem dataList = 1;
	optional int32 allCount = 2;
	optional string nextPage = 3;
}

message Request {
	required C2S c2s = 1;
}

message Response {
	required int32 retType = 1 [default = -400];
	optional string retMsg = 2;
	optional int32 errCode = 3;
	optional S2C s2c = 4;
}
