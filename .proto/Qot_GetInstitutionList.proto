syntax = "proto2";
package Qot_GetInstitutionList;
option java_package = "com.futu.openapi.pb";
option go_package = "github.com/hyperjiang/futu/pb/qotgetinstitutionlist";

enum SortField {
	SortField_Unknown = 0;
	SortField_PositionValue = 1;
	SortField_PositionValueChange = 2;
	SortField_PositionCount = 3;
	SortField_PositionCountChange = 4;
}

enum SortDir {
	SortDir_Descending = 0;
	SortDir_Ascending = 1;
}

message C2S {
	required int32 market = 1;
	optional int32 sortField = 2;
	optional int32 sortDir = 3;
	optional int32 count = 4;
	optional string page = 5;
	optional string namePart = 6;
}

message InstitutionListItem {
	required int32 institutionId = 1;
	optional string institutionName = 2;
	optional double positionValue = 3;
	optional double positionValueChange = 4;
	optional int32 positionCount = 5;
	optional int32 positionCountChange = 6;
	optional string disclosureDate = 7;
}

message S2C {
	repeated InstitutionListItem dataList = 1;
	optional int32 allCount = 2;
	optional string nextPage = 3;
	optional string currency = 4;
}

message Request {
	required C2S c2s = 1;
}

message Response {
	required int32 retType = 1 [default = -400];
	optional string retMsg = 2;
	optional int32 errCode = 3;
	optional S2C s2c = 4;
}
